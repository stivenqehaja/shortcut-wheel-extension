<!DOCTYPE html>
<html>
<head>
  <title>Shortcut Wheel Options</title>
  <style>
    body { padding: 10px; font-family: Arial; }
    .shortcut-row {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .shortcut-row label {
      width: 60px;
      display: inline-block;
    }
    .input-container {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .text-input {
      padding: 5px;
      width: 150px;
    }
    .detect-btn {
      padding: 5px 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .detect-btn:hover {
      background: #45a049;
    }
    .detect-btn.recording {
      background: #f44336;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    #save {
      margin-top: 15px;
      padding: 8px 15px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Configure Shortcuts</h1>
  
  <div class="shortcut-row">
    <label>Top:</label>
    <div class="input-container">
      <input type="text" class="text-input" id="top-text" placeholder="e.g., CTRL+I">
      <button class="detect-btn" id="top-detect">Detect</button>
    </div>
  </div>
  
  <div class="shortcut-row">
    <label>Right:</label>
    <div class="input-container">
      <input type="text" class="text-input" id="right-text" placeholder="e.g., CTRL+L">
      <button class="detect-btn" id="right-detect">Detect</button>
    </div>
  </div>
  
  <div class="shortcut-row">
    <label>Bottom:</label>
    <div class="input-container">
      <input type="text" class="text-input" id="bottom-text" placeholder="e.g., CTRL+K">
      <button class="detect-btn" id="bottom-detect">Detect</button>
    </div>
  </div>
  
  <div class="shortcut-row">
    <label>Left:</label>
    <div class="input-container">
      <input type="text" class="text-input" id="left-text" placeholder="e.g., CTRL+J">
      <button class="detect-btn" id="left-detect">Detect</button>
    </div>
  </div>
  
  <button id="save">Save All Shortcuts</button>
  
  <script src="options.js"></script>
</body>
</html>
